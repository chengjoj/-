<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多词库随机选择器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 600px;
        }
        
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 32px;
        }
        
        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 16px;
        }
        
        /* 词库选择区域 */
        .wordbank-section {
            margin-bottom: 30px;
            padding: 25px;
            background: #f8f9fa;
            border-radius: 15px;
        }
        
        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #555;
            margin-bottom: 15px;
            font-size: 18px;
        }
        
        .section-title i {
            color: #667eea;
        }
        
        .wordbank-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .wordbank-btn {
            padding: 12px;
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
            text-align: center;
        }
        
        .wordbank-btn:hover {
            border-color: #667eea;
            transform: translateY(-2px);
        }
        
        .wordbank-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }
        
        .wordbank-info {
            display: flex;
            justify-content: space-between;
            color: #666;
            font-size: 14px;
            margin-top: 10px;
        }
        
        /* 选择模式区域 */
        .mode-section {
            margin-bottom: 30px;
        }
        
        .mode-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        
        .mode-btn {
            flex: 1;
            padding: 15px;
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 16px;
            text-align: center;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        
        .mode-btn:hover {
            border-color: #667eea;
            transform: translateY(-2px);
        }
        
        .mode-btn.active {
            background: #764ba2;
            color: white;
            border-color: #764ba2;
            box-shadow: 0 5px 15px rgba(118, 75, 162, 0.3);
        }
        
        .mode-desc {
            font-size: 12px;
            opacity: 0.8;
        }
        
        /* 结果显示区域 */
        .result-section {
            text-align: center;
            margin: 40px 0;
            padding: 40px;
            background: linear-gradient(135deg, #f5f7ff 0%, #edf2ff 100%);
            border-radius: 15px;
            border: 2px dashed #d0d7ff;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .result-placeholder {
            color: #888;
            font-size: 20px;
        }
        
        .selected-words {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }
        
        .single-word {
            font-size: 48px;
            font-weight: bold;
            color: #667eea;
            text-align: center;
        }
        
        .three-words {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }
        
        .five-words {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }
        
        .word-item {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            font-weight: 600;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 60px;
            font-size: 18px;
        }
        
        .five-words .word-item {
            font-size: 16px;
            min-height: 50px;
            padding: 10px;
        }
        
        /* 按钮区域 */
        .action-buttons {
            display: flex;
            gap: 20px;
            margin-top: 30px;
        }
        
        .action-btn {
            flex: 1;
            padding: 18px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 18px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .select-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .select-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        
        .reselect-btn {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }
        
        .reselect-btn:hover {
            background: #f5f7ff;
            transform: translateY(-3px);
        }
        
        /* 动画效果 */
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        
        .fade-in {
            animation: fadeIn 0.3s ease-out;
        }
        
        /* 响应式设计 */
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            
            .mode-buttons {
                flex-direction: column;
            }
            
            .three-words {
                grid-template-columns: 1fr;
                gap: 10px;
            }
            
            .five-words {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .action-buttons {
                flex-direction: column;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <h1>多词库随机选择器</h1>
        <p class="subtitle">选择词库和模式，随机选取1个、3个或5个词语</p>
        
        <!-- 词库选择区域 -->
        <div class="wordbank-section">
            <div class="section-title">
                <i class="fas fa-book"></i>
                <span>选择词库</span>
            </div>
            <div class="wordbank-buttons" id="wordbankButtons">
                <!-- 词库按钮会通过JS动态生成 -->
            </div>
            <div class="wordbank-info">
                <span id="currentWordbankName">未选择词库</span>
                <span>词语数量: <span id="wordCount">0</span></span>
            </div>
        </div>
        
        <!-- 选择模式区域 -->
        <div class="mode-section">
            <div class="section-title">
                <i class="fas fa-sliders-h"></i>
                <span>选择模式</span>
            </div>
            <div class="mode-buttons">
                <div class="mode-btn" data-mode="1">
                    <span>单个词语</span>
                    <span class="mode-desc">随机选1个</span>
                </div>
                <div class="mode-btn" data-mode="3">
                    <span>三个词语</span>
                    <span class="mode-desc">随机选3个</span>
                </div>
                <div class="mode-btn" data-mode="5">
                    <span>五个词语</span>
                    <span class="mode-desc">随机选5个</span>
                </div>
            </div>
        </div>
        
        <!-- 结果显示区域 -->
        <div class="result-section">
            <div id="resultDisplay" class="result-placeholder">
                <i class="fas fa-random fa-2x" style="margin-bottom: 15px;"></i>
                <div>点击下方按钮开始随机选择</div>
            </div>
        </div>
        
        <!-- 按钮区域 -->
        <div class="action-buttons">
            <button id="selectRandom" class="action-btn select-btn">
                <i class="fas fa-dice"></i>
                随机选择
            </button>
            <button id="reselect" class="action-btn reselect-btn">
                <i class="fas fa-redo"></i>
                重新选择
            </button>
        </div>
    </div>

    <script>
        // ==================== 词库配置 ====================
        const wordBanks = {
            '常用名词': [
                '太阳', '月亮', '星星', '天空', '云朵',
                '山脉', '河流', '海洋', '森林', '草原',
                '城市', '乡村', '道路', '桥梁', '建筑',
                '家庭', '学校', '公园', '商店', '医院'
            ],
            
            '动物世界': [
                '狮子', '老虎', '大象', '长颈鹿', '斑马',
                '猴子', '熊猫', '袋鼠', '考拉', '企鹅',
                '海豚', '鲸鱼', '鲨鱼', '海龟', '章鱼',
                '老鹰', '孔雀', '鹦鹉', '猫头鹰', '火烈鸟',
                '蝴蝶', '蜜蜂', '蚂蚁', '蜘蛛', '蜻蜓'
            ],
            
            '水果蔬菜': [
                '苹果', '香蕉', '橙子', '葡萄', '草莓',
                '西瓜', '芒果', '桃子', '樱桃', '柠檬',
                '菠萝', '梨子', '柿子', '石榴', '椰子',
                '番茄', '黄瓜', '胡萝卜', '土豆', '洋葱',
                '菠菜', '西兰花', '玉米', '青椒', '茄子'
            ],
            
            '颜色系列': [
                '红色', '橙色', '黄色', '绿色', '蓝色',
                '紫色', '粉色', '棕色', '黑色', '白色',
                '灰色', '金色', '银色', '青色', '琥珀色',
                '珊瑚色', '米色', '栗色', '藏青色', '天蓝色'
            ],
            
            '动作词汇': [
                '跑步', '跳跃', '游泳', '飞行', '爬行',
                '跳舞', '唱歌', '绘画', '写作', '阅读',
                '思考', '学习', '工作', '休息', '旅行',
                '烹饪', '种植', '建造', '驾驶', '探索',
                '创造', '发明', '发现', '改变', '成长'
            ],
            
            '情感表达': [
                '快乐', '悲伤', '愤怒', '惊讶', '恐惧',
                '爱意', '恨意', '希望', '失望', '兴奋',
                '平静', '焦虑', '紧张', '放松', '幸福',
                '孤独', '满足', '好奇', '感激', '自豪'
            ]
        };
        
        // ==================== 初始化变量 ====================
        let currentWordBank = '常用名词';  // 当前选中的词库
        let currentMode = '1';            // 当前模式：1, 3, 5
        let currentSelection = [];        // 当前选中的词语
        
        // ==================== DOM元素 ====================
        const wordbankButtonsContainer = document.getElementById('wordbankButtons');
        const wordbankNameElement = document.getElementById('currentWordbankName');
        const wordCountElement = document.getElementById('wordCount');
        const modeButtons = document.querySelectorAll('.mode-btn');
        const resultDisplay = document.getElementById('resultDisplay');
        const selectRandomBtn = document.getElementById('selectRandom');
        const reselectBtn = document.getElementById('reselect');
        
        // ==================== 初始化页面 ====================
        function initPage() {
            // 1. 创建词库选择按钮
            Object.keys(wordBanks).forEach(wordbankName => {
                const button = document.createElement('div');
                button.className = 'wordbank-btn';
                button.textContent = wordbankName;
                button.dataset.wordbank = wordbankName;
                
                button.addEventListener('click', () => {
                    selectWordBank(wordbankName);
                });
                
                wordbankButtonsContainer.appendChild(button);
            });
            
            // 2. 设置默认选中的词库
            selectWordBank(currentWordBank);
            
            // 3. 设置模式选择按钮事件
            modeButtons.forEach(button => {
                button.addEventListener('click', () => {
                    selectMode(button.dataset.mode);
                });
            });
            
            // 4. 设置默认选中的模式
            selectMode(currentMode);
            
            // 5. 设置选择按钮事件
            selectRandomBtn.addEventListener('click', selectRandomWords);
            reselectBtn.addEventListener('click', selectRandomWords);
        }
        
        // ==================== 选择词库 ====================
        function selectWordBank(wordbankName) {
            // 更新当前词库
            currentWordBank = wordbankName;
            
            // 更新按钮状态
            document.querySelectorAll('.wordbank-btn').forEach(btn => {
                if (btn.dataset.wordbank === wordbankName) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            
            // 更新显示信息
            wordbankNameElement.textContent = wordbankName;
            wordCountElement.textContent = wordBanks[wordbankName].length;
            
            // 清空当前选择
            clearSelection();
        }
        
        // ==================== 选择模式 ====================
        function selectMode(mode) {
            // 更新当前模式
            currentMode = mode;
            
            // 更新按钮状态
            modeButtons.forEach(button => {
                if (button.dataset.mode === mode) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
            
            // 清空当前选择
            clearSelection();
        }
        
        // ==================== 随机选择词语 ====================
        function selectRandomWords() {
            const wordBank = wordBanks[currentWordBank];
            const count = parseInt(currentMode);
            
            // 检查词库是否有足够词语
            if (wordBank.length === 0) {
                showError('词库为空');
                return;
            }
            
            // 如果需要的数量大于词库大小，使用词库大小
            const maxCount = Math.min(count, wordBank.length);
            
            // 随机选择词语（不重复）
            const shuffled = [...wordBank].sort(() => Math.random() - 0.5);
            currentSelection = shuffled.slice(0, maxCount);
            
            // 显示结果
            displayResult();
        }
        
        // ==================== 显示结果 ====================
        function displayResult() {
            // 清空显示区域
            resultDisplay.innerHTML = '';
            
            if (currentSelection.length === 0) {
                resultDisplay.innerHTML = `
                    <div class="result-placeholder">
                        <i class="fas fa-random fa-2x" style="margin-bottom: 15px;"></i>
                        <div>点击下方按钮开始随机选择</div>
                    </div>
                `;
                return;
            }
            
            // 根据模式创建不同的显示方式
            const wordsContainer = document.createElement('div');
            wordsContainer.className = 'selected-words fade-in';
            
            if (currentMode === '1') {
                // 单个词语显示
                const singleWordDiv = document.createElement('div');
                singleWordDiv.className = 'single-word';
                singleWordDiv.textContent = currentSelection[0];
                wordsContainer.appendChild(singleWordDiv);
                
            } else if (currentMode === '3') {
                // 三个词语显示
                const threeWordsDiv = document.createElement('div');
                threeWordsDiv.className = 'three-words';
                
                currentSelection.forEach(word => {
                    const wordDiv = document.createElement('div');
                    wordDiv.className = 'word-item';
                    wordDiv.textContent = word;
                    threeWordsDiv.appendChild(wordDiv);
                });
                
                wordsContainer.appendChild(threeWordsDiv);
                
            } else if (currentMode === '5') {
                // 五个词语显示
                const fiveWordsDiv = document.createElement('div');
                fiveWordsDiv.className = 'five-words';
                
                currentSelection.forEach(word => {
                    const wordDiv = document.createElement('div');
                    wordDiv.className = 'word-item';
                    wordDiv.textContent = word;
                    fiveWordsDiv.appendChild(wordDiv);
                });
                
                wordsContainer.appendChild(fiveWordsDiv);
            }
            
            resultDisplay.appendChild(wordsContainer);
        }
        
        // ==================== 清空选择 ====================
        function clearSelection() {
            currentSelection = [];
            resultDisplay.innerHTML = `
                <div class="result-placeholder">
                    <i class="fas fa-random fa-2x" style="margin-bottom: 15px;"></i>
                    <div>词库已切换，点击按钮重新选择</div>
                </div>
            `;
        }
        
        // ==================== 显示错误 ====================
        function showError(message) {
            resultDisplay.innerHTML = `
                <div class="result-placeholder">
                    <i class="fas fa-exclamation-triangle fa-2x" style="color: #ff6b6b; margin-bottom: 15px;"></i>
                    <div>${message}</div>
                </div>
            `;
        }
        
        // ==================== 页面加载完成 ====================
        document.addEventListener('DOMContentLoaded', initPage);
        
        // ==================== 添加CSS动画 ====================
        const style = document.createElement('style');
        style.textContent = `
            .word-item {
                animation: popIn 0.3s ease-out;
                animation-fill-mode: both;
            }
            
            .word-item:nth-child(1) { animation-delay: 0.1s; }
            .word-item:nth-child(2) { animation-delay: 0.2s; }
            .word-item:nth-child(3) { animation-delay: 0.3s; }
            .word-item:nth-child(4) { animation-delay: 0.4s; }
            .word-item:nth-child(5) { animation-delay: 0.5s; }
            
            @keyframes popIn {
                0% { opacity: 0; transform: translateY(20px) scale(0.9); }
                100% { opacity: 1; transform: translateY(0) scale(1); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
