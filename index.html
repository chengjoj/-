<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>词库随机选择器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 500px;
        }
        
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }
        
        .word-bank {
            margin-bottom: 30px;
        }
        
        .word-bank h2 {
            color: #555;
            margin-bottom: 10px;
            font-size: 18px;
        }
        
        textarea {
            width: 100%;
            height: 200px;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            line-height: 1.6;
            resize: vertical;
            transition: border-color 0.3s;
        }
        
        textarea:focus {
            outline: none;
            border-color: #2575fc;
        }
        
        .result-area {
            text-align: center;
            margin: 30px 0;
            padding: 30px;
            background: #f8f9fa;
            border-radius: 10px;
            border: 2px dashed #dee2e6;
        }
        
        .selected-word {
            font-size: 36px;
            font-weight: bold;
            color: #2575fc;
            min-height: 50px;
            margin-bottom: 20px;
        }
        
        .placeholder {
            color: #6c757d;
            font-style: italic;
        }
        
        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        
        button {
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .select-btn {
            background: #2575fc;
            color: white;
            flex: 2;
        }
        
        .select-btn:hover {
            background: #1c65e0;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(37, 117, 252, 0.3);
        }
        
        .reselection-btn {
            background: #6c757d;
            color: white;
            flex: 1;
        }
        
        .reselection-btn:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }
        
        .word-count {
            text-align: right;
            color: #6c757d;
            font-size: 14px;
            margin-top: 5px;
        }
        
        .footer {
            text-align: center;
            margin-top: 20px;
            color: #6c757d;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>词库随机选择器</h1>
        
        <div class="word-bank">
            <h2>输入词库（每行一个词语）</h2>
            <textarea id="wordInput" placeholder="输入你的词库，每行一个词语...
例如：
苹果
香蕉
橙子
葡萄
西瓜
..."></textarea>
            <div class="word-count">词语数量: <span id="wordCount">0</span></div>
        </div>
        
        <div class="result-area">
            <div class="selected-word">
                <span id="selectedWord" class="placeholder">等待选择...</span>
            </div>
            <div class="buttons">
                <button id="selectRandom" class="select-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                        <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                        <line x1="12" y1="22.08" x2="12" y2="12"></line>
                    </svg>
                    随机选择
                </button>
                <button id="reselect" class="reselection-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M23 4v6h-6"></path>
                        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                    </svg>
                    重新选择
                </button>
            </div>
        </div>
        
        <div class="footer">
            纯静态页面 | 数据仅保存在当前页面中
        </div>
    </div>

    <script>
        // 初始化示例词库
const exampleWords = [
    // --- 热门大作与经典 ---
    '咒术回战', '鬼灭之刃', '间谍过家家', '葬送的芙莉莲',
    '进击的巨人', '电锯人', '死神', '龙珠', '海贼王',
    '火影忍者', '名侦探柯南', '灌篮高手', '排球少年！！',
    '钢之炼金术师', '全职猎人', 'JOJO的奇妙冒险',

    // --- 京都动画（京阿尼）精选 ---
    '凉宫春日的忧郁', 'CLANNAD', '轻音少女', '冰菓',
    '吹响吧！上低音号', '小林家的龙女仆', '紫罗兰永恒花园',
    '中二病也要谈恋爱！', '境界的彼方', '日常', '幸运星',

    // --- 日常、搞笑、恋爱（重点） ---
    '辉夜大小姐想让我告白', '堀与宫村', '总之就是非常可爱',
    '青春猪头少年不会梦到兔女郎学姐', '月刊少女野崎君',
    '古见同学有交流障碍症', '擅长捉弄的高木同学', '徒然喜欢你',
    '阿宅的恋爱太难', '理科生坠入情网，故尝试证明。',
    '和山田谈场Lv999的恋爱', '式守同学不只可爱而已',
    '关于邻家的天使大人不知不觉把我惯成了废人这档子事',
    '败犬女主太多了！', '久保同学不放过我',
    '孤独摇滚！', '摇曳百合', '街角魔族', '天使降临到我身边！',
    '隐瞒之事', '飞翔的魔女', '乌冬面之国的金色毛球',
    'Comic Girls', '少女终末旅行', '玉子市场',

    // --- 其他热门题材（奇幻、异世界、战斗等）---
    'Re:从零开始的异世界生活', '关于我转生变成史莱姆这档事',
    'OVERLORD', '游戏人生', '为美好的世界献上祝福！',
    '打工吧！魔王大人', '魔法科高中的劣等生', '夏日重现',
    '文豪野犬', '东京喰种', '肌肉魔法使 Mashle',
    '胆大党', '蓝色监狱', '黑执事', '地狱乐',
    '僵尸100～在成为僵尸前要做的100件事～', '派对浪客诸葛孔明'
];
        
        // 获取DOM元素
        const wordInput = document.getElementById('wordInput');
        const wordCount = document.getElementById('wordCount');
        const selectedWord = document.getElementById('selectedWord');
        const selectRandomBtn = document.getElementById('selectRandom');
        const reselectBtn = document.getElementById('reselect');
        
        // 当前选中的词
        let currentSelectedWord = '';
        
        // 初始化页面
        function initPage() {
            // 设置示例词库
            wordInput.value = exampleWords.join('\n');
            updateWordCount();
            
            // 添加事件监听
            wordInput.addEventListener('input', updateWordCount);
            selectRandomBtn.addEventListener('click', selectRandomWord);
            reselectBtn.addEventListener('click', selectRandomWord);
        }
        
        // 更新词语数量显示
        function updateWordCount() {
            const text = wordInput.value.trim();
            const words = text.split('\n')
                .map(word => word.trim())
                .filter(word => word.length > 0);
            
            wordCount.textContent = words.length;
            
            // 如果没有词语，禁用按钮
            if (words.length === 0) {
                selectRandomBtn.disabled = true;
                reselectBtn.disabled = true;
            } else {
                selectRandomBtn.disabled = false;
                reselectBtn.disabled = false;
            }
        }
        
        // 随机选择一个词语
        function selectRandomWord() {
            const text = wordInput.value.trim();
            const words = text.split('\n')
                .map(word => word.trim())
                .filter(word => word.length > 0);
            
            if (words.length === 0) {
                selectedWord.textContent = '请先输入词库';
                selectedWord.className = 'placeholder';
                return;
            }
            
            // 随机选择一个词语
            const randomIndex = Math.floor(Math.random() * words.length);
            currentSelectedWord = words[randomIndex];
            
            // 显示选中的词语
            selectedWord.textContent = currentSelectedWord;
            selectedWord.className = '';
            
            // 添加一点动画效果
            selectedWord.style.transform = 'scale(0.8)';
            setTimeout(() => {
                selectedWord.style.transform = 'scale(1)';
            }, 100);
        }
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', initPage);
    </script>
</body>
</html>
